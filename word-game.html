<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O Trem das Palavras - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    .train-container {
      margin-top: 150px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 15px;
      transition: transform 1s ease-in-out;
      padding: 0 20px;
    }
    .train-engine {
      font-size: 7rem;
      margin-right: 20px;
    }
    .letter-wagon {
      width: 120px;
      height: 120px;
      background-color: rgba(255, 255, 255, 0.5);
      border: 6px dashed white;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      font-family: 'Fredoka One', cursive;
      color: rgba(0,0,0,0.2);
      transition: all 0.3s;
    }
    .letter-wagon.active {
      border: 6px solid var(--button-yellow);
      background-color: white;
      color: black;
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .letter-wagon.done {
      background-color: var(--grass-green);
      border: 6px solid white;
      color: white;
    }
  </style>
</head>
<body class="game-container">

  <a href="menu.html" class="btn-kid btn-secondary btn-back">⬅ Voltar</a>

  <div style="text-align: center; margin-top: 20px;">
    <h1 class="logo-title" style="margin: 0; font-size: 2.5rem;">O Trem das Palavras 🚂</h1>
    <p style="font-size: 1.2rem; font-weight: 700; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Aperte as teclas na ordem para o trem andar!</p>
  </div>

  <div class="train-container" id="train">
    <!-- Gerado via JS -->
  </div>

  <div class="grass-footer" style="position: absolute;"></div>

  <script src="js/progress.js?v=5"></script>
  <script src="js/word-game.js?v=5"></script>
</body>
</html>
