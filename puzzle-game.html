<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O Grande Quebra-Cabeça - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <style>
    .puzzle-layout {
      display: flex;
      flex-direction: row;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    
    .pieces-bank {
      background: white;
      border: 4px solid var(--button-orange);
      border-radius: 15px;
      padding: 15px;
      width: 340px;
      min-height: 340px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-content: flex-start;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
    }

    .assembly-board {
      background: rgba(255, 255, 255, 0.5);
      border: 6px dashed #aaa;
      border-radius: 15px;
      width: 320px;
      height: 320px;
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 2px;
      padding: 4px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    .slot {
      background: rgba(255,255,255,0.8);
      border: 2px solid #ccc;
      border-radius: 5px;
      width: 100px;
      height: 100px;
      box-sizing: border-box;
    }
    .slot.hovered {
      background: #e0ffe0;
      border-color: #32CD32;
    }

    .puzzle-piece {
      width: 100px;
      height: 100px;
      cursor: grab;
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .puzzle-piece:active {
      cursor: grabbing;
      transform: scale(1.05);
    }
    
    .puzzle-piece.locked {
      cursor: default;
      box-shadow: none;
      border-radius: 0;
    }

    .btn-controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    @media (max-width: 768px) {
      .puzzle-layout {
        flex-direction: column-reverse;
        align-items: center;
      }
    }
  </style>
</head>
<body class="game-container">

  <a href="menu.html" class="btn-kid btn-secondary btn-back">⬅ Voltar</a>

  <div style="text-align: center; margin-top: 10px;">
    <h1 class="logo-title" style="margin: 0; font-size: 2.2rem;">O Quebra-Cabeça 🧩</h1>
    <p style="font-size: 1.1rem; font-weight: 700; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Arraste as peças da caixa para montá-las no quadro vazio!</p>
  </div>

  <div class="puzzle-layout">
    <!-- Área das Peças Soltas -->
    <div class="pieces-bank" id="pieces-bank">
      <!-- Peças geradas via JS entrarão aqui -->
    </div>

    <!-- Área de Montagem -->
    <div class="assembly-board" id="assembly-board">
      <!-- 9 slots (3x3) -->
      <div class="slot" data-index="0"></div>
      <div class="slot" data-index="1"></div>
      <div class="slot" data-index="2"></div>
      <div class="slot" data-index="3"></div>
      <div class="slot" data-index="4"></div>
      <div class="slot" data-index="5"></div>
      <div class="slot" data-index="6"></div>
      <div class="slot" data-index="7"></div>
      <div class="slot" data-index="8"></div>
    </div>
  </div>

  <div class="btn-controls">
    <button class="btn-kid btn-secondary" id="btn-reload" style="padding: 10px 20px; font-size: 1.2rem;">🔄 Nova Imagem</button>
  </div>

  <script src="js/progress.js"></script>
  <script src="js/puzzle-game.js"></script>
</body>
</html>
