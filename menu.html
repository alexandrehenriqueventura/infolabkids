<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha de Aventura - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=7">
  <style>
    body {
      background: #87CEEB;
      overflow-x: hidden;
    }
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background: rgba(255, 255, 255, 0.9);
      border-bottom: 5px solid var(--button-yellow);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
    }
    
    .stats {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-dark);
      display: flex;
      gap: 20px;
    }
    
    .btn-store {
      background: #9b59b6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1.2rem;
      font-family: 'Fredoka One', cursive;
      border-radius: 15px;
      cursor: pointer;
      box-shadow: 0 6px 0 #8e44ad;
      transition: 0.1s;
    }
    .btn-store:active {
      transform: translateY(6px);
      box-shadow: none;
    }

    .trail-container {
      padding: 50px 20px;
      width: 100%;
      max-width: 600px; /* Mais estreito para a trilha ficar focada */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center; /* Centraliza tudo */
      gap: 60px; /* Mais espaço entre os níveis */
      position: relative;
      margin-bottom: 120px;
    }
    
    /* A linha da trilha (pontilhada ou grossa) */
    .trail-container::before {
      content: '';
      position: absolute;
      top: 80px;
      bottom: 80px;
      left: 50%;
      width: 16px;
      background: #dcdde1;
      margin-left: -8px;
      z-index: -1;
      border-radius: 10px;
    }

    .trail-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      width: 100%;
    }
    
    /* Zigue-zague com margens */
    .trail-node:nth-child(odd) {
      transform: translateX(-60px);
    }
    .trail-node:nth-child(even) {
      transform: translateX(60px);
    }

    /* O botão principal circular (estilo Duolingo) */
    .node-content {
      width: 110px;
      height: 110px;
      background: var(--button-yellow);
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.5);
      box-shadow: 0 12px 0 var(--button-orange);
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      z-index: 2;
    }
    
    /* Cores variadas baseadas na posição */
    .trail-node:nth-child(3n+1) .node-content:not(.locked) {
      background: #4cd137; box-shadow: 0 12px 0 #44bd32;
    }
    .trail-node:nth-child(3n+2) .node-content:not(.locked) {
      background: #00a8ff; box-shadow: 0 12px 0 #0097e6;
    }
    .trail-node:nth-child(3n+3) .node-content:not(.locked) {
      background: #9c88ff; box-shadow: 0 12px 0 #8c7ae6;
    }

    .node-content:hover:not(.locked) {
      transform: translateY(-8px);
      box-shadow: 0 20px 0 var(--button-orange);
    }
    .trail-node:nth-child(3n+1) .node-content:hover:not(.locked) { box-shadow: 0 20px 0 #44bd32; }
    .trail-node:nth-child(3n+2) .node-content:hover:not(.locked) { box-shadow: 0 20px 0 #0097e6; }
    .trail-node:nth-child(3n+3) .node-content:hover:not(.locked) { box-shadow: 0 20px 0 #8c7ae6; }
    
    .node-content:active:not(.locked) {
      transform: translateY(12px);
      box-shadow: 0 0 0 transparent !important;
    }

    .node-content.locked {
      background: #e1b12c;
      border-color: #f5f6fa;
      box-shadow: 0 12px 0 #c23616;
      filter: grayscale(100%);
      pointer-events: none;
      opacity: 0.7;
    }

    .node-icon {
      font-size: 3.5rem;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
    }
    
    /* Balão flutuante com o título da fase */
    .node-title-bubble {
      margin-top: 25px;
      background: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-dark);
      border: 3px solid #f5f6fa;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 3;
    }
    
    .node-title-bubble::after {
      content: '';
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 10px solid white;
    }

    /* Modal Loja */
    .store-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .store-content {
      background: white;
      padding: 30px;
      border-radius: 25px;
      max-width: 600px;
      width: 90%;
      text-align: center;
      position: relative;
    }
    .mascot-preview {
      font-size: 6rem;
      margin-bottom: 20px;
      position: relative;
      display: inline-block;
    }
    .mascot-accessory {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4rem;
    }
    .store-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .store-item {
      background: #f0f0f0;
      border: 3px solid #ccc;
      border-radius: 15px;
      padding: 15px;
      cursor: pointer;
    }
    .store-item.owned {
      border-color: var(--grass-green);
      background: #e0ffe0;
    }
    .store-item.equipped {
      border-color: var(--button-yellow);
      background: #fffacd;
    }
    .close-store {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-family: 'Fredoka One';
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="header-panel">
    <a href="index.html" class="btn-kid btn-secondary" style="padding: 10px; font-size: 1rem;">🏠 Voltar</a>
    <div class="stats">
      <span id="star-count">0 ⭐</span>
      <span id="coin-count" style="color: #f1c40f;">0 🪙</span>
    </div>
    <button class="btn-store" onclick="openStore()">Lojinha 🛒</button>
  </div>

  <div class="trail-container" id="trail-container">
    <!-- Gerado via JS -->
  </div>

  <div class="grass-footer" style="position: fixed; bottom: 0; width: 100%; height: 50px; background: var(--grass-green); z-index: -2;"></div>

  <!-- Modal Loja -->
  <div class="store-modal" id="store-modal">
    <div class="store-content">
      <h2>Loja do Mascote</h2>
      <div class="mascot-preview">
        🤖
        <div class="mascot-accessory" id="mascot-acc"></div>
      </div>
      <p style="font-weight: 700; color: #f1c40f; font-size: 1.5rem;">Moedas: <span id="store-coins"></span> 🪙</p>
      
      <div class="store-grid" id="store-grid">
        <!-- Itens gerados via JS -->
      </div>
      
      <button class="close-store" onclick="closeStore()">Fechar</button>
    </div>
  </div>

  <script src="js/progress.js?v=7"></script>
  <script src="js/store.js"></script>
  <script>
    const trailData = [
      { id: 'mouse', title: 'Aprender o Mouse', icon: '🖱️', link: 'mouse-game.html', unlockReq: null },
      { id: 'desktop', title: 'Faxina no PC', icon: '🧹', link: 'desktop-game.html', unlockReq: 'mouse' },
      { id: 'puzzle', title: 'O Quebra-Cabeça', icon: '🧩', link: 'puzzle-game.html', unlockReq: 'desktop' },
      { id: 'keyboard', title: 'O Teclado', icon: '⌨️', link: 'keyboard-game.html', unlockReq: 'puzzle' },
      { id: 'word', title: 'Trem das Palavras', icon: '🚂', link: 'word-game.html', unlockReq: 'keyboard' },
      { id: 'browser', title: 'Navegador Mágico', icon: '🌐', link: 'browser-game.html', unlockReq: 'word' },
      { id: 'robot', title: 'Caminho do Robô', icon: '🤖', link: 'robot-game.html', unlockReq: 'browser' },
      { id: 'math', title: 'Batalha da Tabuada', icon: '⚔️', link: 'math-game.html', unlockReq: 'robot' },
      { id: 'paint', title: 'Estúdio de Pintura', icon: '🎨', link: 'paint-game.html', unlockReq: 'math' },
      { id: 'safety', title: 'Dicas de Segurança', icon: '🛡️', link: 'safety-tips.html', unlockReq: null } // Sempre aberto
    ];

    function renderTrail() {
      const container = document.getElementById('trail-container');
      container.innerHTML = '';
      
      const progress = getProgress();
      
      trailData.forEach(node => {
        const isLocked = node.unlockReq ? !progress[node.unlockReq] : false;
        const isCompleted = progress[node.id];
        
        const nodeEl = document.createElement('div');
        nodeEl.className = 'trail-node';
        
        let extraBadge = isCompleted ? '<div style="position:absolute; top:-10px; right:-10px; font-size:1.5rem;">⭐</div>' : '';
        if (isLocked) extraBadge = '<div style="position:absolute; top:-10px; right:-10px; font-size:1.5rem;">🔒</div>';
        
        nodeEl.innerHTML = `
          <a href="${isLocked ? '#' : node.link}" class="node-content ${isLocked ? 'locked' : ''}">
            ${extraBadge}
            <span class="node-icon">${node.icon}</span>
          </a>
          <div class="node-title-bubble">${node.title}</div>
        `;
        
        container.appendChild(nodeEl);
      });
      
      // Update stats
      let stars = 0;
      for (let k in progress) {
        if (progress[k] && typeof progress[k] === 'boolean') stars++;
      }
      document.getElementById('star-count').innerText = `${stars} ⭐`;
      document.getElementById('coin-count').innerText = `${progress.coins || 0} 🪙`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderTrail();
      if(typeof updateMascotPreview === 'function') updateMascotPreview();
    });
  </script>
</body>
</html>
