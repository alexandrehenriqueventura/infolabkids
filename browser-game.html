<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>O Navegador Mágico - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    .browser-window {
      background: white;
      border: 4px solid #ccc;
      border-radius: 15px;
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .browser-header {
      background: #e0e0e0;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 4px solid #ccc;
    }
    .browser-dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
    }
    .dot.red { background: #FF5D5B; }
    .dot.yellow { background: #FFBB39; }
    .dot.green { background: #00CD4E; }
    
    .browser-bar {
      flex-grow: 1;
      background: white;
      border-radius: 20px;
      padding: 8px 15px;
      font-size: 1.2rem;
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      font-family: 'Quicksand', sans-serif;
    }
    .browser-bar input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 1.2rem;
      font-family: 'Quicksand', sans-serif;
      margin-left: 10px;
    }
    .search-btn {
      background: var(--button-blue);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 1.2rem;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
    }
    
    .browser-content {
      min-height: 350px;
      padding: 20px;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .shortcuts {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }
    .shortcut-btn {
      background: white;
      border: 3px solid var(--button-yellow);
      border-radius: 15px;
      padding: 15px 25px;
      font-size: 1.5rem;
      cursor: pointer;
      font-family: 'Fredoka One', cursive;
      color: var(--text-dark);
      box-shadow: 0 4px 0 var(--button-yellow);
      transition: transform 0.1s;
    }
    .shortcut-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    #loading-spinner {
      display: none;
      font-size: 4rem;
      animation: spin 2s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    #result-card {
      display: none;
      background: white;
      border: 4px solid var(--button-blue);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      animation: pop 0.5s ease-out;
    }
    #result-emoji {
      font-size: 8rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body class="game-container">

  <a href="menu.html" class="btn-kid btn-secondary btn-back">⬅ Voltar</a>

  <div style="text-align: center; margin-top: 10px;">
    <h1 class="logo-title" style="margin: 0; font-size: 2.2rem;">O Navegador Mágico 🌐</h1>
    <p style="font-size: 1.1rem; font-weight: 700; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">A internet traz imagens do mundo todo para você! Digite ou clique abaixo.</p>
  </div>

  <div class="browser-window">
    <div class="browser-header">
      <div class="browser-dots">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
      </div>
      <div class="browser-bar">
        🔍 <input type="text" id="search-input" placeholder="O que você quer ver?" readonly>
      </div>
      <button class="search-btn" id="btn-search">Buscar</button>
    </div>
    
    <div class="browser-content" id="browser-content">
      
      <div id="home-view">
        <h2 style="color: var(--text-dark); font-family: 'Fredoka One', cursive; text-align: center;">Bem-vindo à Internet! Escolha um atalho:</h2>
        <div class="shortcuts">
          <button class="shortcut-btn" data-word="GATO" data-emoji="🐱">GATO</button>
          <button class="shortcut-btn" data-word="CACHORRO" data-emoji="🐶">CACHORRO</button>
          <button class="shortcut-btn" data-word="LEÃO" data-emoji="🦁">LEÃO</button>
          <button class="shortcut-btn" data-word="CARRO" data-emoji="🚗">CARRO</button>
        </div>
      </div>

      <div id="loading-spinner">🌍</div>

      <div id="result-card">
        <div id="result-emoji"></div>
        <h2 id="result-title" style="margin: 0; font-family: 'Fredoka One', cursive; color: var(--text-dark);"></h2>
        <button class="btn-kid btn-secondary" id="btn-voltar-home" style="margin-top: 20px; font-size: 1rem; padding: 10px 20px;">Fazer nova busca</button>
      </div>

    </div>
  </div>

  <div class="grass-footer" style="position: fixed; bottom: 0; width: 100%;"></div>

  <script src="js/progress.js"></script>
  <script src="js/browser-game.js"></script>
</body>
</html>
