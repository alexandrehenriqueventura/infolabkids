<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Estúdio de Pintura - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=3">
  <style>
    .canvas-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }
    canvas {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      border: 4px solid var(--button-blue);
      touch-action: none; /* Previne scroll no celular */
      cursor: crosshair;
    }
    .palette {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.3);
      border-radius: 40px;
    }
    .color-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 4px solid white;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .color-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .color-btn.selected {
      transform: scale(1.1);
      border-color: var(--button-yellow);
    }
    .action-btn {
      font-size: 1.2rem;
      padding: 10px 20px;
      border-radius: 20px;
      border: 4px solid white;
      background: var(--button-red);
      color: white;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      box-shadow: 0 4px 0 #cc0000;
      margin-left: 10px;
    }
    .action-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
  </style>
</head>
<body class="game-container">

  <a href="menu.html" class="btn-kid btn-secondary btn-back">⬅ Voltar</a>

  <div style="text-align: center; margin-top: 20px;">
    <h1 class="logo-title" style="margin: 0; font-size: 2.5rem;">Estúdio de Pintura 🎨</h1>
    <p style="font-size: 1.2rem; font-weight: 700; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Clique, segure e arraste o mouse para desenhar!</p>
  </div>

  <div class="canvas-container">
    <canvas id="paintCanvas" width="800" height="400"></canvas>
    
    <div class="palette">
      <div class="color-btn selected" style="background: black;" data-color="black"></div>
      <div class="color-btn" style="background: red;" data-color="red"></div>
      <div class="color-btn" style="background: blue;" data-color="blue"></div>
      <div class="color-btn" style="background: green;" data-color="green"></div>
      <div class="color-btn" style="background: yellow;" data-color="yellow"></div>
      <button class="action-btn" id="clearBtn">🗑️ Apagar Tudo</button>
    </div>
  </div>

  <div class="grass-footer" style="position: absolute;"></div>

  <script src="js/paint-game.js"></script>
</body>
</html>
