<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ligue as Peças - InfoLab Kids</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    /* Estilos específicos para o jogo Drag and Drop */
    .match-container {
      max-width: 900px;
      width: 95%;
      margin: 0 auto;
      padding: 80px 20px 40px; 
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .draggable-items, .drop-targets {
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      min-width: 250px;
    }
    .draggable {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }
    .draggable:active {
      cursor: grabbing;
      transform: scale(1.05);
    }
    .drop-zone {
      background: rgba(255, 255, 255, 0.3);
      border: 4px dashed #fff;
      border-radius: 20px;
      padding: 20px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.3s;
    }
    .drop-zone.hovered {
      background: rgba(255, 255, 255, 0.7);
      border-color: var(--button-yellow);
    }
    .drop-zone h3 {
      font-size: 1.8rem;
      margin: 0;
      width: 50%;
    }
    .drop-zone .slot {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      background: rgba(0,0,0,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .drop-zone.success {
      background: var(--grass-green);
      border-color: white;
    }
    .drop-zone.success h3 {
      color: white;
    }
    
    #congrats {
      display: none;
      background: var(--button-yellow);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      margin-top: 40px;
      color: var(--text-dark);
      animation: pop 0.5s ease-out;
    }
  </style>
</head>
<body>

  <a href="computer-basics.html" class="btn-kid btn-secondary btn-back-fixed">⬅ Voltar</a>

  <h1 class="logo-title" style="margin-top: 40px; margin-bottom: 0;">Ligue as Peças! 🧩</h1>
  <p style="font-size: 1.2rem; font-weight: 700; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);">Arraste cada desenho para o nome correto.</p>

  <div class="match-container">
    
    <div class="draggable-items">
      <!-- Mouse -->
      <div class="draggable" draggable="true" id="item-mouse" data-target="mouse">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <rect x="30" y="20" width="40" height="60" rx="20" fill="#e0e0e0" stroke="#999" stroke-width="2" />
          <path d="M 30 50 Q 50 40 70 50" stroke="#999" stroke-width="2" fill="none" />
          <line x1="50" y1="20" x2="50" y2="50" stroke="#999" stroke-width="2" />
          <circle cx="50" cy="35" r="4" fill="#666" />
        </svg>
      </div>
      <!-- Teclado -->
      <div class="draggable" draggable="true" id="item-teclado" data-target="teclado">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <rect x="10" y="30" width="80" height="40" rx="5" fill="#ccc" />
          <rect x="15" y="35" width="70" height="30" rx="2" fill="#fff" />
          <rect x="20" y="40" width="8" height="8" rx="1" fill="#999" />
          <rect x="30" y="40" width="8" height="8" rx="1" fill="#999" />
          <rect x="40" y="40" width="8" height="8" rx="1" fill="#999" />
          <rect x="50" y="40" width="8" height="8" rx="1" fill="#999" />
          <rect x="60" y="40" width="20" height="8" rx="1" fill="#999" />
          <rect x="20" y="52" width="60" height="8" rx="1" fill="#999" />
        </svg>
      </div>
      <!-- Monitor -->
      <div class="draggable" draggable="true" id="item-monitor" data-target="monitor">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <rect x="10" y="20" width="80" height="50" rx="5" fill="#333" />
          <rect x="15" y="25" width="70" height="40" fill="#87CEEB" />
          <rect x="40" y="70" width="20" height="15" fill="#666" />
          <rect x="25" y="85" width="50" height="5" rx="2" fill="#333" />
        </svg>
      </div>
      <!-- Gabinete -->
      <div class="draggable" draggable="true" id="item-gabinete" data-target="gabinete">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <rect x="25" y="10" width="50" height="80" rx="5" fill="#444" />
          <rect x="35" y="20" width="30" height="8" fill="#222" />
          <rect x="35" y="32" width="30" height="4" fill="#222" />
          <circle cx="50" cy="70" r="8" fill="#FF4500" />
        </svg>
      </div>
    </div>

    <div class="drop-targets">
      <div class="drop-zone" data-target="monitor">
        <h3>Monitor</h3>
        <div class="slot"></div>
      </div>
      <div class="drop-zone" data-target="mouse">
        <h3>Mouse</h3>
        <div class="slot"></div>
      </div>
      <div class="drop-zone" data-target="gabinete">
        <h3>Gabinete</h3>
        <div class="slot"></div>
      </div>
      <div class="drop-zone" data-target="teclado">
        <h3>Teclado</h3>
        <div class="slot"></div>
      </div>
    </div>
  </div>

  <div id="congrats">
    <h2>🎉 Parabéns! Você conseguiu! 🎉</h2>
    <p style="font-size: 1.2rem; margin-top: 10px;">Você já conhece as partes mágicas do computador.</p>
  </div>

  <div class="grass-footer"></div>

  <script src="js/match-game.js"></script>
</body>
</html>
